# FONDS-1 — the Protection Fund claims book Worker: one door (Bearer
# PROTECTION_OPS_SECRET), one singleton FondsDO. The secret is set via
# `wrangler secret put` in the deploy workflow (piped) — NEVER a [vars] entry:
# this repo is PUBLIC, a var here would be published.
#
# UNPROVEN UNTIL A REAL `wrangler deploy` RUNS. Miniflare binds the DO by its
# own test config, never this file — the binding and the [[migrations]] block
# are validated only by an actual deploy.

name = "protection-service"
main = "dist/worker/worker.mjs"
compatibility_date = "2025-07-05"

[[durable_objects.bindings]]
name = "FONDS"
class_name = "FondsDO"

# FIRST-DEPLOY MIGRATION — `new_sqlite_classes` is CORRECT AND MANDATORY, not a
# coin-flip: Cloudflare stopped issuing key-value-backed DO namespaces
# (changelog 2026-07-09) to any account without a pre-existing one, and the
# Workers Free plan only ever supported the SQLite backend. SQLite-backed DOs
# expose the SAME key-value storage API this DO uses (state.storage.get/put).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FondsDO"]
