name: protection-deploy

# FONDS-1 — deploy the Protection Fund claims book Worker (services/
# protection-service). Mirrors boutik-plus's media-deploy, including the
# post-deploy provenance assertion (the AUDIT-B+1 F9 lesson: `wrangler deploy`
# proves the upload was accepted, not that the running Worker is this bundle).
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act — the standing
# ruling that governs every deploy workflow in the ecosystem.
#
# UNPROVEN UNTIL THIS ACTUALLY RUNS: protection-service has NEVER been
# deployed. The DO binding and the [[migrations]] block in wrangler.toml are
# validated only by a real deploy (miniflare binds by its own test config).
#
# SECRETS AND VARIABLES this run needs (repo settings):
#   · CLOUDFLARE_API_TOKEN (secret) — Workers deploy token.
#   · PLATFORM_CONTRACTS_READ_TOKEN (secret) — same read token ci.yml uses.
#   · PROTECTION_OPS_SECRET (secret) — the founder's ONE key to the fund book,
#     set on the Worker with `wrangler secret put` (value PIPED, never an
#     argument, never [vars] — this repo is public). THE FOUNDER'S ALONE:
#     never bundled into any app, never shared with a supplier or reseller.
#   · PROTECTION_OPS_SECRET_NEXT (optional secret — only during a key
#     change): the new value, accepted beside the old one until the change is
#     finished. Delete it from the repo and re-dispatch to close the window.
#   · PROTECTION_BASE (variable, not secret — a public URL) — the deployed
#     Worker's base URL (e.g. https://protection-service.<account>.workers.dev),
#     used by the provenance assertion below and by ops-console-deploy.yml.
#     On the FIRST dispatch this may not exist yet: the deploy still runs, the
#     assertion fails red with instructions — set the variable and re-dispatch.
#   · PROTECTION_CONSOLE_ORIGIN (variable — origins are public) — the deployed
#     ops console origin, for exact-origin CORS. Empty ⇒ no CORS (curl only).
#
# FAIL-CLOSED BY CONSTRUCTION: a Worker deployed before PROTECTION_OPS_SECRET
# is set refuses every request with the one identical 401. That is correct,
# not broken — set the secret (or re-dispatch with it configured) to arm it.

on:
  workflow_dispatch:

# `actions: read` is for the first step alone: it asks
# GitHub whether ci is green on this commit.
permissions:
  contents: read
  actions: read

concurrency:
  group: protection-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Nothing goes live until the founder approves this run (and sees its commit).
    environment: production
    steps:
      # Every action pinned to a commit SHA, the tag it resolves from kept
      # beside it (the same pins Shop+ and Boutik+ run): a moving tag is code
      # nobody here reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only a commit ci has passed — and whose newest finished ci run is
      # green — can go live. The reasons are in the script's header.
      - name: Only a commit green in ci can go live
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-only-main.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The platform-contracts grant is SCOPED: a gitconfig under the runner's
      # temp dir that only this step reads (GIT_CONFIG_GLOBAL), the token as
      # env rather than in the script text, nothing written when the secret is
      # unset (platform-contracts is public; the lockfile resolves it to a
      # codeload tarball), and the file deleted when the install ends. Three URL
      # forms, one tokened rewrite (pnpm records git deps in ssh/scp form on
      # some resolve paths); --add, because url.<base>.insteadOf is single-valued.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      # Compile workspace packages FIRST (the trap that killed shop-plus's
      # first deploy: bundling before dist/ exists).
      - run: pnpm build
      # Provenance stamp — release is this sha; canon is read from the
      # INSTALLED package, never hand-typed, so it cannot drift from what was
      # actually bundled.
      - name: Resolve the provenance stamp
        run: |
          echo "PLATFORM_RELEASE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "PLATFORM_CANON=$(node -p "require('./node_modules/@platform/contracts/package.json').version")" >> "$GITHUB_ENV"
      - name: Bundle the protection Worker
        run: pnpm --filter @platform/protection-service bundle:worker
      # The deploy tool comes from the lock file (wrangler 4.130.0, a
      # devDependency of this service, integrity-checked) through `pnpm exec`,
      # never fetched from the registry at deploy time beside the Cloudflare key.
      - name: Deploy to Cloudflare Workers
        working-directory: services/protection-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONSOLE_ORIGIN: ${{ vars.PROTECTION_CONSOLE_ORIGIN }}
        run: |
          if [ -n "$CONSOLE_ORIGIN" ]; then
            pnpm exec wrangler deploy --var PROTECTION_CONSOLE_ORIGIN:"$CONSOLE_ORIGIN"
          else
            pnpm exec wrangler deploy
          fi
      # The secret is set AFTER the first deploy (wrangler cannot put a secret
      # on a Worker that does not exist yet). Value PIPED, never an argument —
      # arguments land in process lists and logs.
      - name: Arm PROTECTION_OPS_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/protection-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_SECRET: ${{ secrets.PROTECTION_OPS_SECRET }}
        run: |
          if [ -z "$OPS_SECRET" ]; then
            echo "::warning title=Fonds NON armé::PROTECTION_OPS_SECRET absent — the Worker refuses everything (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$OPS_SECRET" | pnpm exec wrangler secret put PROTECTION_OPS_SECRET

      # KEY CHANGE WINDOW (batch 8) — every key this Worker CHECKS also opens
      # to its `_NEXT` value while one is set, so a sender can move to a new
      # value before the old one stops working. A repo secret X_NEXT is put on
      # the Worker here; once it is gone from the repo, this run deletes it
      # from the Worker too, so a finished change never leaves an old value
      # open. Runs AFTER every key above, so a promotion (X = the new value,
      # X_NEXT deleted) never has a moment where only the old value opens.
      # Names only are printed — never a value or a length.
      - name: Arm or clear the next keys (X_NEXT — the window of a key change)
        working-directory: services/protection-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROTECTION_OPS_SECRET_NEXT: ${{ secrets.PROTECTION_OPS_SECRET_NEXT }}
        run: |
          set -euo pipefail
          LISTED=$(pnpm exec wrangler secret list)
          for NAME in PROTECTION_OPS_SECRET_NEXT; do
            VALUE="${!NAME:-}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | pnpm exec wrangler secret put "$NAME"
              echo "::warning title=Changement de clé en cours::$NAME is set — the old and the new value of ${NAME%_NEXT} both open its doors. To finish: once every sender presents the new value, put it in ${NAME%_NEXT}, delete $NAME from this repository's secrets, and run this workflow again."
            elif grep -q "\"name\": *\"$NAME\"" <<<"$LISTED"; then
              printf 'y\n' | pnpm exec wrangler secret delete "$NAME"
              echo "$NAME: deleted from the Worker — only ${NAME%_NEXT} opens its doors now"
            fi
          done

      # ═══ The F9 assertion: the live Worker must BE the bundle this job built ═══
      # A Workers deploy PROPAGATES; it does not switch — poll up to 180s.
      - name: Assert the live protection Worker is the bundle this job built
        env:
          PROTECTION_BASE: ${{ vars.PROTECTION_BASE }}
        run: |
          set -uo pipefail
          if [ -z "${PROTECTION_BASE}" ]; then
            echo "::error::PROTECTION_BASE repo variable is empty — the deploy above ran, but NOTHING verified it."
            echo "Set the variable to the Worker's URL and re-dispatch so this step can prove the live Worker is this build."
            exit 1
          fi
          BASE="${PROTECTION_BASE%/}"
          OUT=$(mktemp)
          DEADLINE=$(( $(date +%s) + 180 ))
          LIVE_CANON='?'; LIVE_RELEASE='?'
          while :; do
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$BASE/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              LIVE_CANON=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).canon" 2>/dev/null || echo '?')
              LIVE_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).release" 2>/dev/null || echo '?')
              echo "health 200 — live canon=$LIVE_CANON release=$LIVE_RELEASE (want $PLATFORM_CANON / $PLATFORM_RELEASE)"
              if [ "$LIVE_CANON" = "$PLATFORM_CANON" ] && [ "$LIVE_RELEASE" = "$PLATFORM_RELEASE" ]; then
                echo "PROVENANCE OK — live protection Worker is $PLATFORM_RELEASE speaking canon $PLATFORM_CANON."
                exit 0
              fi
            else
              echo "health $CODE — not answering yet"
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::DEPLOY DID NOT TAKE — after 180s the live protection Worker is still not this job's bundle."
              echo "  live canon=$LIVE_CANON release=$LIVE_RELEASE"
              echo "  want canon=$PLATFORM_CANON release=$PLATFORM_RELEASE"
              exit 1
            fi
            sleep 10
          done
