name: ops-console-deploy

# FONDS-2 — deploy the platform ops console (apps/ops-console, Vite static
# build) to Cloudflare Pages. Until this runs, the console exists only in CI
# screenshots — a console the founder cannot open is a shell, whatever its
# tests say.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act.
#
# DESK 1 GOES LIVE ONLY WITH THE BASE URL: the build inlines
# VITE_PROTECTION_BASE (repo variable PROTECTION_BASE — a public URL, no
# secret). Absent ⇒ Desk 1 shows its empty shell (this build sets the
# published profile, which never renders a sample desk — PROFIL-PUBLIÉ).
# THE KEY IS NEVER IN THIS BUILD: the founder types PROTECTION_OPS_SECRET at
# the desk's key door; it lives in page memory for the session only.
#
# DEPLOY ORDER LAW: the protection Worker (protection-deploy.yml, with its
# CORS origin var pointing at THIS console's URL) deploys BEFORE a console
# build that calls it.
#
# SECRETS/VARIABLES: CLOUDFLARE_API_TOKEN + PLATFORM_CONTRACTS_READ_TOKEN
# (secrets, pre-existing pattern) · PROTECTION_BASE (variable, optional).
# If the API token was scoped to Workers only, the first run fails at the
# Pages step with a permission error: extend it with Pages:Edit and
# re-dispatch (that failure reads as configuration, not code).

on:
  workflow_dispatch:

# `actions: read` is for the first step alone: it asks
# GitHub whether ci is green on this commit.
permissions:
  contents: read
  actions: read

concurrency:
  group: ops-console-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Nothing goes live until the founder approves this run (and sees its commit).
    environment: production
    steps:
      # Every action pinned to a commit SHA, the tag it resolves from kept
      # beside it (the same pins Shop+ and Boutik+ run): a moving tag is code
      # nobody here reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only a commit ci has passed — and whose newest finished ci run is
      # green — can go live. The reasons are in the script's header.
      - name: Only a commit green in ci can go live
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-only-main.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The platform-contracts grant is SCOPED: a gitconfig under the runner's
      # temp dir that only this step reads (GIT_CONFIG_GLOBAL), the token as
      # env rather than in the script text, nothing written when the secret is
      # unset (platform-contracts is public; the lockfile resolves it to a
      # codeload tarball), and the file deleted when the install ends. Three URL
      # forms, one tokened rewrite (pnpm records git deps in ssh/scp form on
      # some resolve paths); --add, because url.<base>.insteadOf is single-valued.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      # Build the whole workspace: ops-console's Vite build consumes
      # @platform/protection-service (the shared fund core), which must have
      # its dist/ first.
      - name: Build (VITE_PROTECTION_BASE inlined when configured)
        env:
          VITE_PROTECTION_BASE: ${{ vars.PROTECTION_BASE }}
          # PROFIL-PUBLIÉ (founder ruling 2026-09-30: « No live pages should
          # show any test mode banner ») — the published console never shows a
          # preview ribbon or the sample desks under it: a desk with no live
          # source is its honest empty shell. Unset = the preview (vite dev,
          # the e2e build). A literal: a build posture is read in review.
          VITE_PROFILE: 'production'
        run: pnpm build
      # `pages deploy` does NOT create a missing project — it fails with
      # "project not found" and a suggestion to run `pages project create`.
      # First run creates it; every later run finds it in the list and skips.
      # Idempotent by LOOKUP, not by swallowing an error: a create that fails
      # for a real reason (permissions, quota) still fails the job loudly.
      # The deploy tool comes from the lock file (wrangler 4.130.0, the
      # protection service's devDependency, integrity-checked), never fetched
      # from the registry at deploy time beside the Cloudflare key.
      - name: Ensure the Pages project exists (creates it on the first run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if "$GITHUB_WORKSPACE/services/protection-service/node_modules/.bin/wrangler" pages project list | grep -q 'platform-ops-console'; then
            echo "Pages project platform-ops-console already exists — nothing to create."
          else
            echo "Pages project platform-ops-console not found — creating it."
            "$GITHUB_WORKSPACE/services/protection-service/node_modules/.bin/wrangler" pages project create platform-ops-console --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # A block, not a one-line value: a line that starts with a quote is read
        # as a quoted string, and the rest of the command would break the file.
        run: |
          "$GITHUB_WORKSPACE/services/protection-service/node_modules/.bin/wrangler" pages deploy apps/ops-console/dist --project-name platform-ops-console --branch=main --commit-hash="${{ github.sha }}"
