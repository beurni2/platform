name: ops-console-deploy

# FONDS-2 — deploy the platform ops console (apps/ops-console, Vite static
# build) to Cloudflare Pages. Until this runs, the console exists only in CI
# screenshots — a console the founder cannot open is a shell, whatever its
# tests say.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act.
#
# DESK 1 GOES LIVE ONLY WITH THE BASE URL: the build inlines
# VITE_PROTECTION_BASE (repo variable PROTECTION_BASE — a public URL, no
# secret). Absent ⇒ Desk 1 shows its empty shell (this build sets the
# published profile, which never renders a sample desk — PROFIL-PUBLIÉ).
# THE KEY IS NEVER IN THIS BUILD: the founder types PROTECTION_OPS_SECRET at
# the desk's key door; it lives in page memory for the session only.
#
# DEPLOY ORDER LAW: the protection Worker (protection-deploy.yml, with its
# CORS origin var pointing at THIS console's URL) deploys BEFORE a console
# build that calls it.
#
# SECRETS/VARIABLES: CLOUDFLARE_API_TOKEN + PLATFORM_CONTRACTS_READ_TOKEN
# (secrets, pre-existing pattern) · PROTECTION_BASE (variable, optional).
# If the API token was scoped to Workers only, the first run fails at the
# Pages step with a permission error: extend it with Pages:Edit and
# re-dispatch (that failure reads as configuration, not code).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-console-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Authorize read access to platform-contracts (CI-only)
        run: git config --global url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "https://github.com/beurni2/platform-contracts"
      - name: Authorize read access to platform-contracts (CI-only, SSH forms)
        run: |
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "git@github.com:beurni2/platform-contracts"
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
      - run: pnpm install --frozen-lockfile
      # Build the whole workspace: ops-console's Vite build consumes
      # @platform/protection-service (the shared fund core), which must have
      # its dist/ first.
      - name: Build (VITE_PROTECTION_BASE inlined when configured)
        env:
          VITE_PROTECTION_BASE: ${{ vars.PROTECTION_BASE }}
          # PROFIL-PUBLIÉ (founder ruling 2026-09-30: « No live pages should
          # show any test mode banner ») — the published console never shows a
          # preview ribbon or the sample desks under it: a desk with no live
          # source is its honest empty shell. Unset = the preview (vite dev,
          # the e2e build). A literal: a build posture is read in review.
          VITE_PROFILE: 'production'
        run: pnpm build
      # `pages deploy` does NOT create a missing project — it fails with
      # "project not found" and a suggestion to run `pages project create`.
      # First run creates it; every later run finds it in the list and skips.
      # Idempotent by LOOKUP, not by swallowing an error: a create that fails
      # for a real reason (permissions, quota) still fails the job loudly.
      - name: Ensure the Pages project exists (creates it on the first run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if npx --yes wrangler@4 pages project list | grep -q 'platform-ops-console'; then
            echo "Pages project platform-ops-console already exists — nothing to create."
          else
            echo "Pages project platform-ops-console not found — creating it."
            npx --yes wrangler@4 pages project create platform-ops-console --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy apps/ops-console/dist --project-name platform-ops-console --branch=main --commit-hash="${{ github.sha }}"
